services:
  # Демо-сайт классифайда — сцена, на которой проверяется онбординг.
  # Папка проекта монтируется с хоста: правки подхватываются на лету,
  # а node_modules оказываются на диске, чтобы редактор видел типы.
  demo:
    build:
      context: ./frontend/demo
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/demo:/app
    environment:
      # Без этого Vite внутри контейнера не отдаёт страницу наружу.
      - VITE_HOST=0.0.0.0
