services:
  # Демо-сайт классифайда — сцена, на которой проверяется онбординг.
  # Папка проекта монтируется с хоста: правки подхватываются на лету,
  # а node_modules оказываются на диске, чтобы редактор видел типы.
  demo:
    build:
      context: ./frontend/demo
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/demo:/app

  # Виджет собирается в один файл и раздаётся с отдельного адреса —
  # так же, как он раздавался бы с CDN. Демо-сайт подключает его
  # с другого порта, то есть кросс-доменно, как настоящий сторонний сайт.
  widget:
    build:
      context: ./frontend/widget
    ports:
      - '8082:8082'
    volumes:
      - ./frontend/widget:/app
