name: Frontend Check

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  demo-and-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        project: [demo, widget]

    defaults:
      run:
        working-directory: ./frontend/${{ matrix.project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
